[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wapimaji-mcp"
version = "0.1.4"
description = "MCP server for Kenya water stress and drought intelligence"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Gabriel Mahia", email = "contact@aikungfu.dev"}]
keywords = ["mcp", "kenya", "water", "drought", "africa", "ndma", "east-africa"]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "africastalking>=1.2.7",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
]

[project.scripts]
wapimaji-mcp = "wapimaji_mcp.server:main"

[project.urls]
Homepage = "https://github.com/gabrielmahia/wapimaji-mcp"
Repository = "https://github.com/gabrielmahia/wapimaji-mcp"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
